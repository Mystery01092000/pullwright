name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Channel (Slack, Teams, web), runner (docker, local), and the smallest task that shows it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Control plane log lines and, if a runner was involved, the issue comments it left. Remove tokens.
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit

[project]
name = "pullwright"
version = "0.1.0"
description = "Chat task to reviewed pull request: describer/verifier planning, Haiku workers under a Sonnet supervisor, checks until green"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.1.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1,<1",
    "mcp>=2.3.0",
    "pyjwt[crypto]>=2.10,<3",
    "rich>=15.0.0",
    "slack-bolt>=1.21,<2",
    "sse-starlette>=3.6.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
pullwright = "pullwright.cli:main"
pullwright-work = "pullwright.runner.job:main"
pullwright-serve = "pullwright.serve:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pullwright"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
